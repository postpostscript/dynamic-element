<!DOCTYPE html>
<html>
  <head>
    <link
      rel="stylesheet"
      href="https://esm.sh/sakura.css@1.5.0/css/sakura-ink.css"
    />

    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self' 'unsafe-inline' 'unsafe-eval' https://esm.sh/signal-polyfill@0.2.2/es2022/signal-polyfill.mjs"
    />

    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="shortcut icon" href="data:image/x-icon;," type="image/x-icon" />
  </head>
  <body class="loading">
    <h1 id="header">
      <pre>&lt;x-is /&gt;</pre>
    </h1>

    <div id="templates"></div>
    <x-is src="#x-define" name="x-define"></x-is>

    <script type="module">
      import DynamicElement from "../dist/dynamic-element.js";

      const urls = [
        "templates/x-define.html",
        "templates/x-instance.html",
        "templates/x-events.html",
        "templates/x-iframe.html",
        "templates/reactive/x-reactive.html",
        "templates/reactive/x-props.html",
        "templates/reactive/x-render.html",
      ];

      const templates = document.getElementById("templates");
      await Promise.all(
        urls.map((url) => {
          return fetch(url)
            .then((res) => res.text())
            .then((text) => {
              const el = document.createElement("div");

              el.innerHTML = text;
              templates.append(el.children[0]);
            });
        })
      );

      DynamicElement.install("x-is");
    </script>

    <!-- <x-is src="#x-iframe" width="500px" height="500px"></x-is> -->

    <template id="some-random-template" extend="#x-reactive, #x-events">
      <script>
        let entries = 0;
        const $log = this.shadowRoot.getElementById("log");
        console.log(this);
        this.watch(
          () => JSON.stringify(this.$props) + "\n",
          (text) => {
            $log.append(document.createTextNode(text));
            entries++;
            if (entries > 5) {
              $log.childNodes[0].remove();
            }
          }
        );

        this.result = this.toComputed(() => this.eval(this.calculation));
      </script>

      <div></div>
    </template>

    <x-define src="#some-random-template" name="reactive-test"> </x-define>

    <main>
      <!--
      <x-is src="#app">
        <template
          id="app"
          extend="#x-props, #x-events, #x-render"
          observe="x, y, z"
        >
          <script>
            Object.assign(this, {
              x: 1,
              y: 2,
              z: 3,
              calculation: "this.x * this.y + this.z",
            });
          </script>

</template>
</x-is> -->
      <reactive-test id="reactiveTest"></reactive-test>
    </main>
  </body>
</html>
